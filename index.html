<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OYİ Rapor Asistanı</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e293b; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
    .hidden { display: none; }
    .btn { background-color: #2563eb; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; margin-top: 10px; }
    .btn:hover { background-color: #1d4ed8; }
    .btn-voice { background-color: #059669; margin-bottom: 10px; }
    .btn-voice:hover { background-color: #047857; }
    .btn-add { background-color: #0284c7; width: auto; font-size: 14px; padding: 8px 15px; margin-top: 5px; }
    .btn-add:hover { background-color: #0369a1; }
    .btn-remove { background-color: #dc2626; color: white; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: bold; }
    .btn-remove:hover { background-color: #b91c1c; }
    
    /* Bulgular Modülü Stilleri */
    .bulgu-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-end; }
    .bulgu-row-no { flex: 1; }
    .bulgu-row-tanim { flex: 3; }
    .bulgu-row-yer { flex: 3; }
    .section-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-top: 20px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dashed #cbd5e1; }

    .report-output { margin-top: 25px; padding: 15px; background: #f8fafc; border-left: 4px solid #2563eb; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 13px; line-height: 1.5; }
    .req { color: #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <h2>OYİ Rapor Asistanı</h2>
  
  <form id="oyiForm">
    <!-- Ekip Kodu & Tarih/Saat -->
    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <label for="ekipKodu">OYİ Ekip Kodu <span class="req">*</span></label>
        <input type="text" id="ekipKodu" placeholder="Örn: OYİ-01" required>
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="tarihSaat">Tarih / Saat <span class="req">*</span></label>
        <input type="datetime-local" id="tarihSaat" required>
      </div>
    </div>

    <!-- Olay Türü -->
    <div class="form-group">
      <label for="olayTuru">Olay Türü <span class="req">*</span></label>
      <select id="olayTuru" required>
        <option value="">-- Olay Türü Seçiniz --</option>
        <option value="Hırsızlık">Hırsızlık</option>
        <option value="Kasten Yaralama">Kasten Yaralama</option>
        <option value="Mala Zarar Verme">Mala Zarar Verme</option>
        <option value="Ateşli Silahla Yaralama">Ateşli Silahla Yaralama</option>
        <option value="Şüpheli Ölüm">Şüpheli Ölüm</option>
        <option value="Diğer">Diğer</option>
      </select>
    </div>

    <!-- Talep Eden Ekip -->
    <div class="form-group">
      <label for="talepEdenEkip">Talep Eden Ekip</label>
      <select id="talepEdenEkip" onchange="toggleCeraimNo()">
        <option value="">-- Ekip Seçiniz (Opsiyonel) --</option>
        <option value="Asayiş Büro Amirliği">Asayiş Büro Amirliği</option>
        <option value="Cinayet Büro Amirliği">Cinayet Büro Amirliği</option>
        <option value="Narkotik Suçlarla Mücadele Büro">Narkotik Suçlarla Mücadele Büro</option>
        <option value="Polis Merkezi Amirliği">Polis Merkezi Amirliği</option>
        <option value="Jandarma Asayiş">Jandarma Asayiş</option>
      </select>
    </div>

    <!-- Ceraim No (Dinamik Alan: Yalnızca Talep Eden Ekip Seçilirse Açılır) -->
    <div class="form-group hidden" id="ceraimContainer">
      <label for="ceraimNo">Ceraim No <span class="req">*</span> (Yalnızca Sayı)</label>
      <input 
        type="text" 
        id="ceraimNo" 
        placeholder="Örn: 1452" 
        inputmode="numeric" 
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
      >
    </div>

    <!-- Olay Yeri Adresi -->
    <div class="form-group">
      <label for="adres">Olay Yeri Adresi <span class="req">*</span></label>
      <input type="text" id="adres" placeholder="Mahalle, Cadde, Sokak, Bina No..." required>
    </div>

    <!-- İnceleme Notları & Sesle Metin Ekleme -->
    <div class="form-group">
      <label for="notlar">İnceleme Genel Notları <span class="req">*</span></label>
      <button type="button" class="btn btn-voice" onclick="startSpeechRecognition()">🎤 Sesle Not Ekle</button>
      <textarea id="notlar" rows="3" placeholder="Olay yeri genel durumu, hava/aydınlatma şartları vb..." required></textarea>
    </div>

    <!-- BULGULAR MODÜLÜ (Ayrı Sütun/Liste Alanı) -->
    <div class="section-title">Olay Yeri Bulguları</div>
    <div id="bulgularContainer">
      <!-- Dinamik Bulgu Satırları Buraya Eklenecek -->
    </div>
    <button type="button" class="btn btn-add" onclick="addBulguRow()">➕ Yeni Bulgu Ekle</button>

    <br><br>
    <button type="button" class="btn" onclick="generateReport()">Raporu Oluştur</button>
  </form>

  <!-- Oluşturulan Rapor Metni Çıktısı -->
  <div id="reportResult" class="report-output hidden"></div>
</div>

<script>
  let bulguCounter = 0;

  // Sayfa yüklendiğinde varsayılan 1 adet Bulgu satırı ekle
  window.onload = function() {
    addBulguRow("1");
  };

  // 1. Ceraim No sekmesinin dinamik görünürlük mantığı
  function toggleCeraimNo() {
    const ekipSelect = document.getElementById('talepEdenEkip');
    const ceraimContainer = document.getElementById('ceraimContainer');
    const ceraimInput = document.getElementById('ceraimNo');

    if (ekipSelect.value.trim() !== "") {
      ceraimContainer.classList.remove('hidden');
      ceraimInput.setAttribute('required', 'true');
    } else {
      ceraimContainer.classList.add('hidden');
      ceraimInput.removeAttribute('required');
      ceraimInput.value = '';
    }
  }

  // 2. Dinamik Bulgu Satırı Ekleme Fonksiyonu (1, 1-1, 1-2 formatlarını destekler)
  function addBulguRow(defaultNo = "") {
    bulguCounter++;
    const container = document.getElementById('bulgularContainer');
    
    const rowId = `bulgu_row_${bulguCounter}`;
    const bulguCard = document.createElement('div');
    bulguCard.className = 'bulgu-card';
    bulguCard.id = rowId;

    bulguCard.innerHTML = `
      <div class="bulgu-row-no">
        <label style="font-size: 12px;">Bulgu No</label>
        <input type="text" class="bulgu-no-input" placeholder="Örn: 1 veya 1-1" value="${defaultNo}">
      </div>
      <div class="bulgu-row-tanim">
        <label style="font-size: 12px;">Bulgunun Tanımı</label>
        <input type="text" class="bulgu-tanim-input" placeholder="Örn: Deforme olmuş kovan / Parmak izi">
      </div>
      <div class="bulgu-row-yer">
        <label style="font-size: 12px;">Bulgunun Yeri</label>
        <input type="text" class="bulgu-yer-input" placeholder="Örn: Salondaki sehpanın 20 cm solunda">
      </div>
      <div>
        <button type="button" class="btn-remove" onclick="removeBulguRow('${rowId}')" title="Bulguyu Sil">✕</button>
      </div>
    `;

    container.appendChild(bulguCard);
  }

  // Bulgu Satırını Silme
  function removeBulguRow(rowId) {
    const row = document.getElementById(rowId);
    if (row) {
      row.remove();
    }
  }

  // 3. Sesle Yazdırma (Voice-to-Text) Entegrasyonu
  function startSpeechRecognition() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert("Tarayıcınız sesle yazdırma özelliğini desteklememektedir.");
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'tr-TR';
    recognition.interimResults = false;

    recognition.onstart = function() {
      alert("Dinleniyor... Konuşabilirsiniz.");
    };

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      const notlarArea = document.getElementById('notlar');
      notlarArea.value += (notlarArea.value ? " " : "") + transcript;
    };

    recognition.onerror = function(event) {
      alert("Ses tanıma hatası oluştu: " + event.error);
    };

    recognition.start();
  }

  // 4. Resmi Rapor Oluşturucu Mantığı
  function generateReport() {
    const ekipKodu = document.getElementById('ekipKodu').value;
    const tarihSaat = document.getElementById('tarihSaat').value;
    const olayTuru = document.getElementById('olayTuru').value;
    const talepEkip = document.getElementById('talepEdenEkip').value;
    const ceraimNo = document.getElementById('ceraimNo').value;
    const adres = document.getElementById('adres').value;
    const notlar = document.getElementById('notlar').value;

    if (!ekipKodu || !tarihSaat || !olayTuru || !adres || !notlar) {
      alert("Lütfen zorunlu alanları doldurunuz.");
      return;
    }

    if (talepEkip && !ceraimNo) {
      alert("Talep eden ekip seçildiği için Ceraim No girilmesi zorunludur.");
      return;
    }

    // Bulguları Toplama
    const bulguRows = document.querySelectorAll('.bulgu-card');
    let bulgularMetni = "";
    
    if (bulguRows.length > 0) {
      bulgularMetni += "\nOLAY YERİNDE ELDE EDİLEN BULGULAR:\n";
      let count = 0;
      bulguRows.forEach((row) => {
        const no = row.querySelector('.bulgu-no-input').value.trim();
        const tanim = row.querySelector('.bulgu-tanim-input').value.trim();
        const yer = row.querySelector('.bulgu-yer-input').value.trim();

        if (tanim || yer) {
          count++;
          const displayNo = no ? no : count.toString();
          bulgularMetni += `  - BULGU NO ${displayNo}: ${tanim || "Tanım belirtilmedi"} [Bulunduğu Yer: ${yer || "Belirtilmedi"}]\n`;
        }
      });

      if (count === 0) {
        bulgularMetni += "  (Olay yerinde herhangi bir bulgu kaydı girilmemiştir.)\n";
      }
    } else {
      bulgularMetni += "\nOLAY YERİNDE ELDE EDİLEN BULGULAR:\n  (Herhangi bir bulgu kaydı bulunmamaktadır.)\n";
    }

    let talepMetni = "";
    if (talepEkip && ceraimNo) {
      talepMetni = `${talepEkip}'nin talebi ve ${ceraimNo} Ceraim sayılı dosyasına istinaden, `;
    } else if (talepEkip) {
      talepMetni = `${talepEkip}'nin talebine istinaden, `;
    }

    const tarihFormatted = tarihSaat.replace('T', ' ');

    const raporMetni = 
`==================================================
           T.C. EMNİYET MÜDÜRLÜĞÜ
        OLAY YERİ İNCELEME RAPORU METNİ
==================================================

EKİP KODU : ${ekipKodu}
TARIH/SAAT: ${tarihFormatted}
OLAY TÜRÜ : ${olayTuru}
ADRES     : ${adres}

RAPOR METNİ:
${talepMetni}"${adres}" adresinde meydana gelen ${olayTuru} olayı ile ilgili olarak ${ekipKodu} numaralı OYİ ekibimizce belirtilen adreste inceleme çalışmalarına başlanmıştır.

İNCELEME GENEL NOTLARI:
${notlar}
${bulgularMetni}
İşbu rapor olay yerinde tanzim edilmiştir.`;

    const reportResultDiv = document.getElementById('reportResult');
    reportResultDiv.textContent = raporMetni;
    reportResultDiv.classList.remove('hidden');
    reportResultDiv.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
