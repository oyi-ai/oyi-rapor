<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OYİ Rapor Asistanı - Saha Modu</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome İkon Kütüphanesi -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Inter Yazı Tipi -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- html2pdf.js (PDF Oluşturucu Kütüphane) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b1329;
      --card-bg: #15203b;
      --subcard-bg: #0d162d;
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --border-color: #243456;
      --text-muted: #8b9cb7;
      --text-main: #f8fafc;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    .sub-card {
      background: var(--subcard-bg);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 14px;
      padding: 16px;
    }

    .form-control, .form-select {
      background-color: var(--subcard-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.92rem;
      transition: all 0.25s ease;
    }

    .form-control:focus, .form-select:focus {
      background-color: #070d1d;
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .form-control::placeholder {
      color: #4f6385;
    }

    .form-label {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .btn-tactical {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: none;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.8px;
      border-radius: 12px;
      padding: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    .btn-tactical:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
      transform: translateY(-1px);
    }

    .btn-mic {
      transition: all 0.3s ease;
      font-weight: 600;
      border-radius: 20px;
    }

    .recording {
      animation: pulse-red 1.3s infinite;
      background-color: #dc2626 !important;
      border-color: #ef4444 !important;
      color: #ffffff !important;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }

    @keyframes pulse-red {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }

    .pulse-dot {
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .badge-tactical {
      background-color: rgba(2, 132, 199, 0.2);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body class="py-3 py-md-4">
  <div class="container" style="max-width: 520px;">
    <div class="main-card p-3 p-sm-4">
      
      <!-- Ortalanmış Header -->
      <div class="text-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
        <div class="d-flex justify-content-center mb-2">
          <span class="badge badge-tactical px-2 py-1 rounded-pill d-flex align-items-center gap-1">
            <i class="fa-solid fa-circle text-success pulse-dot" style="font-size: 0.5rem;"></i> SAHA CANLI
          </span>
        </div>

        <div class="d-flex align-items-center justify-content-center gap-3">
          <div class="header-icon-box shadow-sm" style="font-size: 1.5rem; line-height: 1;">
            🇹🇷
          </div>

          <div>
            <h5 class="fw-bold mb-0 text-white text-uppercase" style="letter-spacing: 0.8px;">OYİ RAPOR ASİSTANI</h5>
            <small class="text-secondary" style="font-size: 0.72rem; letter-spacing: 0.5px;">OLAY YERİ İNCELEME SİSTEMİ</small>
          </div>

          <div class="header-icon-box text-info shadow-sm" style="font-size: 1.3rem;">
            <i class="fa-solid fa-fingerprint"></i>
          </div>
        </div>
      </div>

      <form id="raporForm">
        <!-- Olay Adı -->
        <div class="mb-3">
          <label class="form-label text-uppercase">
            <i class="fa-solid fa-clipboard-list me-1 text-info"></i> Olay Adı
          </label>
          <input type="text" id="olayAdi" class="form-control" placeholder="Örn: Evden Hırsızlık, Ateşli Silah" required>
        </div>

        <!-- Saatler -->
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label text-uppercase">
              <i class="fa-solid fa-clock me-1 text-info"></i> Bildiriliş Saati
            </label>
            <input type="time" id="bildirilisSaati" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label text-uppercase">
              <i class="fa-solid fa-route me-1 text-info"></i> İntikal Saati
            </label>
            <input type="time" id="intikalSaati" class="form-control" required>
          </div>
        </div>

        <!-- Ekip Kodu -->
        <div class="mb-3">
          <label class="form-label text-uppercase">
            <i class="fa-solid fa-user-shield me-1 text-info"></i> Talep Eden Ekip Kodu
          </label>
          <input type="text" id="ekipKodu" class="form-control" placeholder="Örn: 4512 veya Asayiş Ekipleri" required>
        </div>

        <!-- Olay Adresi -->
        <div class="mb-3">
          <label class="form-label text-uppercase">
            <i class="fa-solid fa-location-dot me-1 text-info"></i> Olay Adresi
          </label>
          <textarea id="olayAdresi" class="form-control" rows="2" placeholder="Mahalle, sokak, bina no, ilçe..." required></textarea>
        </div>

        <!-- Şahıs Bilgileri Sub-Card -->
        <div class="sub-card mb-3">
          <div class="d-flex align-items-center gap-2 mb-3">
            <i class="fa-solid fa-id-card-clip text-info"></i>
            <h6 class="fw-bold mb-0 text-white text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">İlgili Şahıs Bilgileri</h6>
          </div>
          
          <div class="mb-2">
            <label class="form-label">T.C. KİMLİK NO</label>
            <input type="text" id="tcNo" class="form-control form-control-sm" maxlength="11" placeholder="11 haneli T.C. Kimlik No">
          </div>

          <div class="mb-2">
            <label class="form-label">AD - SOYAD</label>
            <input type="text" id="adSoyad" class="form-control form-control-sm" placeholder="Şahsın Adı ve Soyadı">
          </div>

          <div>
            <label class="form-label">OLAYDAKİ SIFATI</label>
            <select id="sifat" class="form-select form-select-sm">
              <option value="">Seçiniz...</option>
              <option value="Şahıs Yok">Şahıs Yok</option>
              <option value="Müşteki">Müşteki</option>
              <option value="Şüpheli">Şüpheli</option>
              <option value="Yaralı">Yaralı</option>
              <option value="Mağdur">Mağdur</option>
              <option value="Müşteki Yakını">Müşteki Yakını</option>
            </select>
          </div>
        </div>

        <!-- Notlar & Sesle Yaz -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label text-uppercase mb-0">
              <i class="fa-solid fa-pen-to-square me-1 text-info"></i> Notlar
            </label>
            <button type="button" id="micBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3 btn-mic">
              <i class="fa-solid fa-microphone me-1"></i> Sesle Yaz
            </button>
          </div>
          <textarea id="notlar" class="form-control" rows="3" placeholder="Olay yeri gözlemleri, delil detayları veya ilave notlar..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-tactical w-100 mt-2">
          <i class="fa-solid fa-file-pdf me-2"></i> RAPORU KAYDET & PDF İNDİR
        </button>
      </form>

      <div id="statusAlert" class="alert mt-3 d-none text-center" role="alert"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyewwJAOXNMOPFJ9RG8m7vDIb78EO7pykHX5iPQxgCUjxqeg4fEghG9vUeFVKdgsVRgg/exec";

    // Sıfat "Şahıs Yok" Seçilince Otomatik Doldurma Mantığı
    document.getElementById('sifat').addEventListener('change', function() {
      const adSoyadInput = document.getElementById('adSoyad');
      const tcNoInput = document.getElementById('tcNo');
      
      if (this.value === 'Şahıs Yok') {
        adSoyadInput.value = 'Kamu Hukuku';
        tcNoInput.value = '-';
      } else {
        if (adSoyadInput.value === 'Kamu Hukuku') adSoyadInput.value = '';
        if (tcNoInput.value === '-') tcNoInput.value = '';
      }
    });

    // Ses Tanıma Entegrasyonu
    const micBtn = document.getElementById('micBtn');
    const notlar = document.getElementById('notlar');
    let recognition = null;
    let isListening = false;

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        notlar.value += (notlar.value ? ' ' : '') + transcript;
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => { if (isListening) stopListening(); };

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
          isListening = true;
          micBtn.classList.remove('btn-outline-danger');
          micBtn.classList.add('recording');
          micBtn.innerHTML = '<i class="fa-solid fa-circle-stop me-1"></i> Dinleniyor...';
        } else {
          stopListening();
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.innerHTML = '<i class="fa-solid fa-microphone-slash me-1"></i> Desteklenmiyor';
    }

    function stopListening() {
      if (recognition && isListening) recognition.stop();
      isListening = false;
      micBtn.classList.remove('recording');
      micBtn.classList.add('btn-outline-danger');
      micBtn.innerHTML = '<i class="fa-solid fa-microphone me-1"></i> Sesle Yaz';
    }

    // PDF Oluşturma Fonksiyonu (Düzeltildi)
    async function generatePDF(payload) {
      const today = new Date().toLocaleDateString('tr-TR');
      const pdfContainer = document.createElement('div');
      
      // Elemanı ekran koordinatında tutarak arka plana gizliyoruz (z-index: -99999)
      pdfContainer.style.position = 'fixed';
      pdfContainer.style.top = '0';
      pdfContainer.style.left = '0';
      pdfContainer.style.zIndex = '-99999';
      pdfContainer.style.width = '210mm';
      pdfContainer.style.boxSizing = 'border-box';
      pdfContainer.style.padding = '20mm';
      pdfContainer.style.color = '#000000';
      pdfContainer.style.backgroundColor = '#ffffff';
      pdfContainer.style.fontFamily = 'Arial, sans-serif';

      const formattedNotlar = payload.notlar 
        ? payload.notlar.replace(/\n/g, '<br>') 
        : 'Herhangi bir not girilmedi.';

      pdfContainer.innerHTML = `
        <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 20px;">
          <h2 style="margin: 0; font-size: 18pt; font-weight: bold;">T.C. EMNİYET MÜDÜRLÜĞÜ</h2>
          <h3 style="margin: 5px 0 0 0; font-size: 14pt; color: #333;">OLAY YERİ İNCELEME RAPORU</h3>
          <p style="margin: 5px 0 0 0; font-size: 10pt; color: #666;">Tarih: ${today}</p>
        </div>

        <h4 style="margin-bottom: 8px; font-size: 11pt; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 4px;">1. Olay ve Ekip Bilgileri</h4>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 10pt;" border="1" cellpadding="6">
          <tr>
            <td style="width: 30%; font-weight: bold; background: #f2f2f2;">Olay Adı:</td>
            <td>${payload.olayAdi || '-'}</td>
          </tr>
          <tr>
            <td style="font-weight: bold; background: #f2f2f2;">Bildiriliş Saati:</td>
            <td>${payload.bildirilisSaati || '-'}</td>
          </tr>
          <tr>
            <td style="font-weight: bold; background: #f2f2f2;">İntikal Saati:</td>
            <td>${payload.intikalSaati || '-'}</td>
          </tr>
          <tr>
            <td style="font-weight: bold; background: #f2f2f2;">Talep Eden Ekip:</td>
            <td>${payload.ekipKodu || '-'}</td>
          </tr>
          <tr>
            <td style="font-weight: bold; background: #f2f2f2;">Olay Adresi:</td>
            <td>${payload.olayAdresi || '-'}</td>
          </tr>
        </table>

        <h4 style="margin-bottom: 8px; font-size: 11pt; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 4px;">2. Şahıs Bilgileri</h4>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 10pt;" border="1" cellpadding="6">
          <tr>
            <td style="width: 30%; font-weight: bold; background: #f2f2f2;">T.C. Kimlik No:</td>
            <td>${payload.tcNo || '-'}</td>
          </tr>
          <tr>
            <td style="font-weight: bold; background: #f2f2f2;">Ad Soyad:</td>
            <td>${payload.adSoyad || '-'}</td>
          </tr>
          <tr>
            <td style="font-weight: bold; background: #f2f2f2;">Olaydaki Sıfatı:</td>
            <td>${payload.sifat || '-'}</td>
          </tr>
        </table>

        <h4 style="margin-bottom: 8px; font-size: 11pt; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 4px;">3. Olay Yeri Notları ve İnceleme Detayları</h4>
        <div style="border: 1px solid #000; padding: 12px; min-height: 120px; font-size: 10pt; background: #fafafa; margin-bottom: 40px; line-height: 1.5; word-wrap: break-word;">
          ${formattedNotlar}
        </div>

        <table style="width: 100%; margin-top: 40px; font-size: 10pt; text-align: center; border: none;">
          <tr>
            <td style="width: 50%; border: none;">
              <strong>Raporu Düzenleyen</strong><br><br><br><br>
              İmza / Mühür
            </td>
            <td style="width: 50%; border: none;">
              <strong>Ekip Amiri</strong><br><br><br><br>
              İmza
            </td>
          </tr>
        </table>
      `;

      document.body.appendChild(pdfContainer);

      const safeFileName = (payload.olayAdi || 'Rapor').replace(/[^a-zA-Z0-9çğıöşüÇĞİÖŞÜ]/g, '_');
      const opt = {
        margin:       0,
        filename:     `OYI_Raporu_${safeFileName}_${today.replace(/\./g, '-')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, logging: false, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        await html2pdf().set(opt).from(pdfContainer).save();
      } finally {
        document.body.removeChild(pdfContainer);
      }
    }

    // Form Gönderme İşlemi
    document.getElementById('raporForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusAlert = document.getElementById('statusAlert');
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> İletiliyor & PDF Hazırlanıyor...';

      const payload = {
        olayAdi: document.getElementById('olayAdi').value,
        bildirilisSaati: document.getElementById('bildirilisSaati').value,
        intikalSaati: document.getElementById('intikalSaati').value,
        ekipKodu: document.getElementById('ekipKodu').value,
        olayAdresi: document.getElementById('olayAdresi').value,
        tcNo: document.getElementById('tcNo').value,
        adSoyad: document.getElementById('adSoyad').value,
        sifat: document.getElementById('sifat').value,
        notlar: document.getElementById('notlar').value
      };

      try {
        // 1. Google Sheets'e Kaydet
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // 2. PDF Hazırla ve İndir
        await generatePDF(payload);

        statusAlert.className = "alert alert-success mt-3 text-center bg-dark text-success border-success";
        statusAlert.innerHTML = '<i class="fa-solid fa-circle-check me-2"></i> Rapor kaydedildi ve PDF indirildi!';
        statusAlert.classList.remove('d-none');
        document.getElementById('raporForm').reset();
      } catch (err) {
        statusAlert.className = "alert alert-danger mt-3 text-center bg-dark text-danger border-danger";
        statusAlert.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-2"></i> Bir işlem sırasında hata oluştu.';
        statusAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-file-pdf me-2"></i> RAPORU KAYDET & PDF İNDİR';
        setTimeout(() => statusAlert.classList.add('d-none'), 4000);
      }
    });
  </script>
</body>
</html>
