<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OYİ Rapor Asistanı - Saha Modu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    .card { 
      background-color: #1e293b; 
      border: 1px solid #334155; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
    }
    .sub-card { 
      background-color: #0f172a; 
      border: 1px solid #0284c7; 
      border-radius: 12px; 
      padding: 16px; 
    }
    .form-control, .form-select { 
      background-color: #0f172a; 
      border: 1px solid #334155; 
      color: #f8fafc; 
    }
    .form-control:focus, .form-select:focus { 
      background-color: #0f172a; 
      border-color: #38bdf8; 
      color: #ffffff; 
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); 
    }
    .form-control::placeholder { color: #64748b; }
    .form-label { color: #94a3b8; font-size: 0.85rem; letter-spacing: 0.5px; }
    .btn-primary { 
      background-color: #0284c7; 
      border: none; 
      font-weight: 700; 
      letter-spacing: 0.5px; 
    }
    .btn-primary:hover { background-color: #0369a1; }
    .btn-mic { transition: all 0.3s ease; }
    .recording { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    .badge-tactical { background-color: #0369a1; color: #e0f2fe; border: 1px solid #38bdf8; }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 550px;">
    <div class="card p-4">
      
      <!-- Başlık Alanı -->
      <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
        <div>
          <h4 class="fw-bold text-info mb-0">🛡️ OYİ RAPOR ASİSTANI</h4>
          <span class="text-muted small">Olay Yeri İnceleme Formu</span>
        </div>
        <span class="badge badge-tactical px-2 py-1 rounded-pill small">SAHA MODU</span>
      </div>

      <form id="raporForm">
        <!-- Olay Genel Bilgileri -->
        <div class="mb-3">
          <label class="form-label fw-bold text-uppercase">Olay Adı</label>
          <input type="text" id="olayAdi" class="form-control" placeholder="Örn: Evden Hırsızlık, Ateşli Silah vb." required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label fw-bold text-uppercase">Bildiriliş Saati</label>
            <input type="time" id="bildirilisSaati" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label fw-bold text-uppercase">İntikal Saati</label>
            <input type="time" id="intikalSaati" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold text-uppercase">Talep Eden Ekip Kodu</label>
          <input type="text" id="ekipKodu" class="form-control" placeholder="Örn: 4512 veya Asayiş Ekipler" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold text-uppercase">Olay Adresi</label>
          <textarea id="olayAdresi" class="form-control" rows="2" placeholder="Mahalle, sokak, bina no, ilçe..." required></textarea>
        </div>

        <!-- Şahıs Bilgileri Kartı -->
        <div class="sub-card mb-3">
          <h6 class="fw-bold text-info mb-3 text-uppercase">👤 İlgili Şahıs Bilgileri</h6>
          
          <div class="mb-2">
            <label class="form-label small fw-semibold">T.C. KİMLİK NO</label>
            <input type="text" id="tcNo" class="form-control form-control-sm" maxlength="11" placeholder="11 haneli TC No">
          </div>

          <div class="mb-2">
            <label class="form-label small fw-semibold">AD - SOYAD</label>
            <input type="text" id="adSoyad" class="form-control form-control-sm" placeholder="Şahsın Adı ve Soyadı">
          </div>

          <div>
            <label class="form-label small fw-semibold">OLAYDAKİ SIFATI</label>
            <select id="sifat" class="form-select form-select-sm">
              <option value="">Seçiniz...</option>
              <option value="Müşteki">Müşteki</option>
              <option value="Şüpheli">Şüpheli</option>
              <option value="Yaralı">Yaralı</option>
              <option value="Mağdur">Mağdur</option>
              <option value="Müşteki Yakını">Müşteki Yakını</option>
            </select>
          </div>
        </div>

        <!-- Notlar ve Sesli Giriş -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label fw-bold text-uppercase mb-0">Notlar</label>
            <button type="button" id="micBtn" class="btn btn-outline-danger btn-sm rounded-pill btn-mic">
              🎤 Sesle Yaz
            </button>
          </div>
          <textarea id="notlar" class="form-control" rows="3" placeholder="Olay yeri gözlemleri veya ilave notlar..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 mt-2">
          RAPORU KAYDET
        </button>
      </form>

      <div id="statusAlert" class="alert mt-3 d-none text-center" role="alert"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyewwJAOXNMOP9FJ9RG8m7vDIb78EO7pykHX5iPQxgCUjxqeg4fEghG9vUeFVKdgsVRgg/exec";

    // Ses Tanıma Entegrasyonu
    const micBtn = document.getElementById('micBtn');
    const notlar = document.getElementById('notlar');
    let recognition = null;
    let isListening = false;

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        notlar.value += (notlar.value ? ' ' : '') + transcript;
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => { if (isListening) stopListening(); };

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
          isListening = true;
          micBtn.classList.remove('btn-outline-danger');
          micBtn.classList.add('btn-danger', 'recording');
          micBtn.innerHTML = '🛑 Dinleniyor...';
        } else {
          stopListening();
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.innerText = 'Ses Desteklenmiyor';
    }

    function stopListening() {
      if (recognition && isListening) recognition.stop();
      isListening = false;
      micBtn.classList.remove('btn-danger', 'recording');
      micBtn.classList.add('btn-outline-danger');
      micBtn.innerHTML = '🎤 Sesle Yaz';
    }

    // Form Gönderme İşlemi
    document.getElementById('raporForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusAlert = document.getElementById('statusAlert');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Kaydediliyor...';

      const payload = {
        olayAdi: document.getElementById('olayAdi').value,
        bildirilisSaati: document.getElementById('bildirilisSaati').value,
        intikalSaati: document.getElementById('intikalSaati').value,
        ekipKodu: document.getElementById('ekipKodu').value,
        olayAdresi: document.getElementById('olayAdresi').value,
        tcNo: document.getElementById('tcNo').value,
        adSoyad: document.getElementById('adSoyad').value,
        sifat: document.getElementById('sifat').value,
        notlar: document.getElementById('notlar').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusAlert.className = "alert alert-success mt-3 text-center bg-dark text-success border-success";
        statusAlert.innerText = "✅ Rapor başarıyla kaydedildi!";
        statusAlert.classList.remove('d-none');
        document.getElementById('raporForm').reset();
      } catch (err) {
        statusAlert.className = "alert alert-danger mt-3 text-center bg-dark text-danger border-danger";
        statusAlert.innerText = "❌ Gönderim hatası oluştu.";
        statusAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'RAPORU KAYDET';
        setTimeout(() => statusAlert.classList.add('d-none'), 3000);
      }
    });
  </script>
</body>
</html>
